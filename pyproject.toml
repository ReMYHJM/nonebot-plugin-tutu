[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-tutu"
version = "1.0.0"
description = "从 yppp.net 获取随机二次元图片，支持多张合并发送"
readme = "README.md"
authors = [{name = "ReM_YHJM", email = "your-email@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.0.0",
    "nonebot-adapter-onebot>=2.0.0",
    "aiohttp>=3.8.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/ReMYHJM/nonebot-plugin-tutu"
Repository = "https://github.com/ReMYHJM/nonebot-plugin-tutu"
Issues = "https://github.com/ReMYHJM/nonebot-plugin-tutu/issues"

[tool.nonebot]
plugins = ["nonebot_plugin_tutu"]
